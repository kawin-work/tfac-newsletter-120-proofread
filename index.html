<html lang="th">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ตรวจพิสูจน์อักษร TFAC Newsletter 120</title>
<meta name="description" content="ผลตรวจพิสูจน์อักษร TFAC Newsletter ฉบับที่ 120 (ต.ค.–ธ.ค. 2569) เลือกดูได้ทั้งรอบ 1 และรอบ 2">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef2f8; --text:#1b2433; --muted:#5b6678; --line:#dde3ec;
  --brand:#1f3a68; --brand-2:#2f6fd0;
  --A:#c62828; --B:#d35400; --C:#1565c0; --D:#7b2fa0;
  --A-bg:#fdecec; --B-bg:#fff1e5; --C-bg:#e8f0fc; --D-bg:#f4eafa;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --surface:#171e29; --surface-2:#1e2735; --text:#e6ebf3; --muted:#9aa6b8; --line:#2a3445;
    --brand:#9dbbf0; --brand-2:#6ea3ff;
    --A:#ff6b6b; --B:#ff9f43; --C:#5aa2ff; --D:#c58af0;
    --A-bg:#3a1c1f; --B-bg:#3a2816; --C-bg:#16263d; --D-bg:#2c1d38;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --surface-2:#1e2735; --text:#e6ebf3; --muted:#9aa6b8; --line:#2a3445;
  --brand:#9dbbf0; --brand-2:#6ea3ff;
  --A:#ff6b6b; --B:#ff9f43; --C:#5aa2ff; --D:#c58af0;
  --A-bg:#3a1c1f; --B-bg:#3a2816; --C-bg:#16263d; --D-bg:#2c1d38;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand-2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.hero{background:linear-gradient(135deg,#1f3a68,#2f6fd0);color:#fff;padding:36px 0 28px}
.hero .eyebrow{opacity:.85;font-size:14px;letter-spacing:.02em}
.hero h1{margin:4px 0 6px;font-size:clamp(24px,4vw,34px);line-height:1.3;font-weight:700}
.hero p{margin:0;opacity:.9;max-width:760px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px;opacity:.9}
.hero .dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.45);color:#fff;text-decoration:none;font-size:14px;background:rgba(255,255,255,.08)}
.btn:hover{background:rgba(255,255,255,.18)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:-22px 0 18px;position:relative}
.stat{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat.A .n{color:var(--A)} .stat.B .n{color:var(--B)} .stat.C .n{color:var(--C)} .stat.D .n{color:var(--D)}
.stat .bar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--brand-2)}
.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.45}
.chip .c{color:var(--muted);font-size:12px}
.search{flex:1 1 200px;min-width:160px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.jump a{font-size:13px;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;position:relative}
.jump a.hasA{border-color:var(--A);color:var(--A);font-weight:600}
.jump a.hidden{display:none}
.priority{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--A);border-radius:14px;padding:16px 18px;margin:16px 0 8px;box-shadow:var(--shadow)}
.priority h2{margin:0 0 8px;font-size:18px;color:var(--A)}
.priority ol{margin:0;padding-left:22px}
.priority li{margin:4px 0}
.priority li a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted)}
section.page{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0;box-shadow:var(--shadow);scroll-margin-top:70px}
section.page.hidden{display:none}
.page h2{grid-column:1/-1;margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.page h2 .pg{background:var(--brand);color:var(--surface);border-radius:8px;padding:1px 10px;font-size:15px}
.page h2 .sub{font-size:13px;color:var(--muted);font-weight:400}
.sheet{position:relative;align-self:start;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.sheet img{display:block;width:100%;height:auto}
.box{position:absolute;border:2px solid var(--c);border-radius:3px;background:color-mix(in srgb,var(--c) 10%,transparent);transition:box-shadow .2s,background .2s}
.box b{position:absolute;top:-1px;left:-1px;transform:translateY(-100%);background:var(--c);color:#fff;font:600 10px/1.4 "IBM Plex Sans Thai",sans-serif;padding:0 4px;border-radius:3px 3px 0 0}
.box.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 25%,transparent);z-index:3}
.box.hidden{display:none}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px 10px 14px;background:var(--surface);transition:background .2s,box-shadow .2s;cursor:pointer}
.item.on{background:var(--cbg);box-shadow:0 0 0 2px var(--c) inset}
.item.hidden{display:none}
.item.done{opacity:.55}
.item.done .found{text-decoration:line-through}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.num{font-weight:700;color:var(--c);font-size:14px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--cbg);color:var(--c);font-weight:600}
.item label{margin-left:auto;font-size:13px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.found{margin:0}
.fix{margin:6px 0 0;font-size:14.5px;color:var(--muted)}
.fix strong{color:var(--text);font-weight:600}
.A{--c:var(--A);--cbg:var(--A-bg)} .B{--c:var(--B);--cbg:var(--B-bg)} .C{--c:var(--C);--cbg:var(--C-bg)} .D{--c:var(--D);--cbg:var(--D-bg)}
.st{font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600;border:1px solid currentColor}
.st-S{color:var(--A)} .st-P{color:var(--B)} .st-N{color:var(--C)} .st-F{color:#2e7d32}
.note{margin:6px 0 0;font-size:14px;color:var(--B)}
.ref{font-size:12px;color:var(--muted)}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0 0;box-shadow:var(--shadow)}
.progress .bar2{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0}
.progress .bar2 i{display:block;height:100%}
.progress .leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.progress .leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details.fixed{background:var(--surface);border:1px solid var(--line);border-left:5px solid #2e7d32;border-radius:14px;padding:12px 18px;margin:18px 0;box-shadow:var(--shadow)}
details.fixed summary{cursor:pointer;font-weight:600;color:#2e7d32}
details.fixed ul{margin:10px 0 0;padding-left:20px} details.fixed li{margin:5px 0;font-size:14.5px}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{color:var(--muted);font-size:13px;padding:24px 0 40px;text-align:center}
.lb{position:fixed;inset:0;background:rgba(8,12,20,.86);z-index:50;display:none;overflow:auto;padding:24px 16px}
.lb.open{display:block}
.lb .inner{position:relative;max-width:900px;margin:0 auto}
.lb .sheet{cursor:default}
.lb .close{position:fixed;top:12px;right:16px;font:inherit;font-size:15px;border:0;border-radius:999px;padding:6px 14px;background:#fff;color:#111;cursor:pointer;z-index:51}
.themebtn{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
header.hero{position:relative}
@media (max-width:860px){
  section.page{grid-template-columns:1fr}
  .sheet{max-width:460px;width:100%;justify-self:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat.total{grid-column:1/-1}
  .count{margin-left:0;width:100%}
  .toolbar{position:static}
  #chips{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  #chips .chip{flex:0 0 auto}
  .search{flex:1 1 100%}
}
@media print{
  .toolbar,.themebtn,.lb,.hero .dl{display:none!important}
  section.page{break-inside:avoid;box-shadow:none}
}

section.page{scroll-margin-top:150px}

/* round tabs */
.tabs{position:sticky;top:0;z-index:30;background:var(--brand);background:linear-gradient(135deg,#1f3a68,#2a5aa8);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tabs .wrap{display:flex;gap:6px;align-items:flex-end;padding-top:10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:0;border:0;border-radius:12px 12px 0 0;padding:9px 18px 8px;background:rgba(255,255,255,.14);color:#fff;font:inherit;cursor:pointer;text-align:left;min-width:170px}
.tab:hover{background:rgba(255,255,255,.24)}
.tab .t{font-weight:700;font-size:16px;line-height:1.3}
.tab .s{font-size:12.5px;opacity:.85;line-height:1.4}
.tab[aria-selected="true"]{background:var(--bg);color:var(--text)}
.tab[aria-selected="true"] .s{color:var(--muted);opacity:1}
.toolbar{top:65px}
header.hero{padding-bottom:28px}
.later{font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600}
.later-F{background:#e3f4e5;color:#2e7d32} .later-P{background:var(--B-bg);color:var(--B)} .later-S{background:var(--A-bg);color:var(--A)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .later-F{background:#173a1d;color:#7fd28a}}
:root[data-theme="dark"] .later-F{background:#173a1d;color:#7fd28a}
@media (max-width:860px){.toolbar{top:auto}.tab{min-width:0;flex:1 1 0;padding:8px 10px}.tab .t{font-size:15px}.tab .s{font-size:11px}.themebtn{position:static;float:right;margin:12px 16px 0 8px}}
</style>
</head>

  const seg=(s,c)=>`<i style="width:${cnt(s)/tot*100}%;background:${c}"></i>`;
  $("progress").innerHTML = `<strong>${r==="r2"?"ความคืบหน้าจากรอบแรก":"ผลการแก้ของรอบนี้ (ตรวจในรอบ 2)"}</strong> · 90 จุดเดิม${r==="r2"?` + ${cnt("N")} จุดใหม่`:""}
    <div class="bar2">${seg("F","#2e7d32")}${seg("P","var(--B)")}${seg("S","var(--A)")}${r==="r2"?seg("N","var(--C)"):""}</div>
    <div class="leg"><span><b style="background:#2e7d32"></b>แก้แล้ว ${cnt("F")}</span><span><b style="background:var(--B)"></b>แก้บางส่วน ${cnt("P")}</span><span><b style="background:var(--A)"></b>ยังไม่แก้ ${cnt("S")}</span>${r==="r2"?`<span><b style="background:var(--C)"></b>พบใหม่ ${cnt("N")}</span>`:""}</div>`;

  $("chips").innerHTML = Object.keys(CATS).map(c=>
    `<button class="chip ${c}" data-cat="${c}" aria-pressed="true" type="button"><span class="dot" style="background:var(--c)"></span>${CATS[c]} <span class="c">${byCat(c)}</span></button>`).join(" ");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const c=b.dataset.cat; if(active.has(c)){active.delete(c);b.setAttribute("aria-pressed","false")}else{active.add(c);b.setAttribute("aria-pressed","true")} apply();
  });

  const badge = d => r==="r2" ? `<span class="st st-${d.st}">${STN[d.st]}</span>` : `<span class="later later-${d.later}">${LATER[d.later]}</span>`;
  const A = DATA.filter(d=>d.cat==="A");
  $("priority").innerHTML = `<h2>ต้องแก้ก่อนเผยแพร่ (${A.length} จุด)</h2><ol>` +
    A.map(d=>`<li><a href="#${r}" data-go="${key(d)}">หน้า ${d.page}</a> ${badge(d)} — ${esc(d.found)}</li>`).join("") + `</ol>`;

  pages=[...new Set(DATA.map(d=>d.page))].sort((a,b)=>a-b);
  $("pages").innerHTML = pages.map(p=>{
    const its=DATA.filter(d=>d.page===p);
    return `<section class="page" id="${r}p${p}" data-page="${p}">
      <h2><span class="pg">หน้า ${p}</span><span class="sub">${its.length} จุด</span></h2>
      <div class="sheet" data-page="${p}">${sheetHTML(p)}</div>
      <ul class="items">${its.map(d=>`<li class="item ${d.cat}" id="${key(d)}" data-id="${key(d)}">
        <div class="top"><span class="num">${tag(d)}</span><span class="tag">${CATS[d.cat]}</span>${badge(d)}
        ${r==="r2" && d.page1 && d.page1!==d.page ? `<span class="ref">หน้า ${d.page1} ในฉบับแรก</span>`:""}
        ${r==="r1" && d.later!=="F" && d.laterPage!==d.page ? `<span class="ref">ฉบับ D2 อยู่หน้า ${d.laterPage}</span>`:""}
        <label onclick="event.stopPropagation()"><input type="checkbox" data-done="${key(d)}"> แก้แล้ว</label></div>
        <p class="found">${esc(d.found)}</p>
        ${r==="r2"&&d.note?`<p class="note">สถานะ: ${esc(d.note)}</p>`:""}
        ${r==="r1"&&d.laterNote?`<p class="note">รอบ 2: ${esc(d.laterNote)}</p>`:""}
        <p class="fix"><strong>แนะนำ:</strong> ${esc(d.fix)}</p></li>`).join("")}</ul>
    </section>`;}).join("");
  $("jump").innerHTML = pages.map(p=>`<a href="#${r}" data-jump="${p}" class="${DATA.some(d=>d.page===p&&d.cat==="A")?"hasA":""}">${p}</a>`).join("");
  document.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault(); $(`${r}p${a.dataset.jump}`).scrollIntoView({behavior:"smooth",block:"start"});});

  const FIXED = DB.r2.filter(d=>d.st==="F");
  $("fixed").style.display = r==="r2" ? "" : "none";
  $("fixed").open=false;
  $("fixed").innerHTML = `<summary>แก้เรียบร้อยแล้ว ${FIXED.length} จุด (จากรอบแรก) — คลิกเพื่อดู</summary><ul>` +
    FIXED.map(d=>`<li><strong>#${d.id}</strong> หน้า ${d.page1}: ${esc(d.found)}</li>`).join("") + `</ul>`;

  document.querySelectorAll("[data-done]").forEach(cb=>{
    const id=cb.dataset.done; cb.checked=done.has(id);
    cb.onchange=()=>{cb.checked?done.add(id):done.delete(id); store.set(`tfac120-${r}-done`,[...done]); apply();};
  });
  document.querySelectorAll(".item").forEach(li=>li.onclick=()=>{
    const {bx}=focusItem(li.dataset.id);
    if(bx && matchMedia("(max-width:860px)").matches) bx.scrollIntoView({behavior:"smooth",block:"center"});
  });
  document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{
    e.preventDefault(); const id=a.dataset.go;
    const s=$(id).closest("section"); s.classList.remove("hidden");
    s.scrollIntoView({behavior:"smooth",block:"start"}); focusItem(id);
  });
  document.querySelectorAll(".page .sheet").forEach(sh=>sh.onclick=e=>openLb(+sh.dataset.page, e.target.closest(".box")));
  apply();
}

function sheetHTML(p){
  return `<img src="${R}/pages/p${pad(p)}.jpg" alt="หน้า ${p}" loading="lazy" width="1102" height="1426">` +
    DATA.filter(d=>d.page===p && d.box).map(d=>`<div class="box ${d.cat}" data-id="${key(d)}" style="left:${d.box[0]}%;top:${d.box[1]}%;width:${d.box[2]}%;height:${d.box[3]}%"><b>${d.id}</b></div>`).join("");
}
function focusItem(id){
  document.querySelectorAll(".box.on,.item.on").forEach(e=>e.classList.remove("on"));
  const it=$(id); const bx=document.querySelector(`.page .box[data-id="${id}"]`);
  if(it) it.classList.add("on"); if(bx) bx.classList.add("on");
  return {it,bx};
}
const lb=$("lb"), lbInner=$("lbInner");
function openLb(p, box){
  lbInner.innerHTML=`<div class="sheet">${sheetHTML(p)}</div>`;
  lbInner.querySelectorAll(".box").forEach(b=>{ if(document.querySelector(`.page .box[data-id="${b.dataset.id}"]`).classList.contains("hidden")) b.classList.add("hidden"); });
  lb.classList.add("open"); document.body.style.overflow="hidden";
  if(box){ focusItem(box.dataset.id); const b2=lbInner.querySelector(`.box[data-id="${box.dataset.id}"]`); b2.classList.add("on"); setTimeout(()=>b2.scrollIntoView({block:"center"}),30); }
}
const closeLb=()=>{lb.classList.remove("open");document.body.style.overflow="";};
$("lbClose").onclick=closeLb;
lb.onclick=e=>{if(e.target===lb) closeLb();};
addEventListener("keydown",e=>{if(e.key==="Escape") closeLb();});
["hideDone","onlyNew"].forEach(i=>$(i).onchange=apply);
$("q").oninput=apply;

function apply(){
  const q=$("q").value.trim().toLowerCase();
  const hide=$("hideDone").checked, onlyNew=$("onlyNew").checked;
  let shown=0;
  DATA.forEach(d=>{
    const k=key(d), extra = R==="r2" ? (STN[d.st]+" "+(d.note||"")) : (LATER[d.later]+" "+(d.laterNote||""));
    const hay=(d.found+" "+d.fix+" "+extra+" "+CATS[d.cat]+" หน้า "+d.page+" "+d.id).toLowerCase();
    const vis=active.has(d.cat) && (!q || hay.includes(q)) && !(hide && done.has(k)) && !(onlyNew && d.st!=="N");
    const el=$(k); el.classList.toggle("hidden",!vis); el.classList.toggle("done",done.has(k));
    const bx=document.querySelector(`.page .box[data-id="${k}"]`); if(bx) bx.classList.toggle("hidden",!vis);
    if(vis) shown++;
  });
  pages.forEach(p=>{
    const any=DATA.some(d=>d.page===p && !$(key(d)).classList.contains("hidden"));
    $(`${R}p${p}`).classList.toggle("hidden",!any);
    const j=document.querySelector(`.jump a[data-jump="${p}"]`); if(j) j.classList.toggle("hidden",!any);
  });
  $("count").textContent=`แสดง ${shown} จาก ${DATA.length} จุด`;
  $("empty").style.display=shown?"none":"block";
  $("doneN").textContent=`ติ๊กแก้แล้ว ${done.size}`;
  $("doneBar").style.width=(done.size/DATA.length*100)+"%";
}
render(curRound());
</script>
</body>
</html>
